<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="Expires" content="0" />
  <title>Core 4 — Tuscany &amp; Beyond July 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #1a1108 0%, #2d1f0e 40%, #1a2a1a 100%);
      font-family: Georgia, 'Times New Roman', serif;
      color: #e8dcc8;
      padding-bottom: 60px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 60px 24px 40px;
      border-bottom: 1px solid rgba(200,169,126,0.2);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(200,169,126,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-date {
      font-size: 12px;
      letter-spacing: 0.35em;
      color: #C8A97E;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: normal;
      margin-bottom: 10px;
      line-height: 1.1;
      color: #f0e4cc;
      letter-spacing: -0.01em;
    }
    .header-sub {
      color: #a89070;
      font-size: 1.05rem;
      font-style: italic;
      margin-bottom: 28px;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .pill {
      background: rgba(200,169,126,0.12);
      border: 1px solid rgba(200,169,126,0.3);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: #C8A97E;
    }

    /* ── Timeline ── */
    .timeline {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 0;
    }
    .day-row {
      display: flex;
      gap: 20px;
      margin-bottom: 8px;
    }

    /* Spine */
    .spine {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 40px;
    }
    .icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .spine-line {
      width: 1px;
      flex: 1;
      min-height: 20px;
      margin: 4px 0;
    }

    /* Card */
    .card {
      flex: 1;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.3s;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .card.open { /* border set inline via JS */ }

    .card-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-date {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .card-label {
      font-size: 1.05rem;
      color: #f0e4cc;
      font-weight: normal;
    }
    .chevron {
      font-size: 18px;
      transition: transform 0.3s;
      line-height: 1;
    }
    .chevron.open { transform: rotate(180deg); }

    .card-body {
      padding: 0 20px 18px;
      border-top-width: 1px;
      border-top-style: solid;
      display: none;
    }
    .card-body.open { display: block; }

    .items { margin-top: 14px; }
    .item {
      display: flex;
      gap: 14px;
      margin-bottom: 10px;
      align-items: flex-start;
    }
    .item-time {
      min-width: 72px;
      font-size: 11px;
      letter-spacing: 0.05em;
      padding-top: 1px;
      font-family: monospace;
      flex-shrink: 0;
    }
    .item-text {
      font-size: 0.9rem;
      color: #d4c4a8;
      line-height: 1.5;
    }
    .note {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      border-width: 1px;
      border-style: solid;
      font-size: 0.82rem;
      color: #a89070;
      font-style: italic;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #5a4a36;
      font-size: 12px;
      letter-spacing: 0.15em;
    }

    /* ── Tube Map ── */
    .tube-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 12px;
      border-bottom: 1px solid rgba(200,169,126,0.2);
      text-align: center;
    }
    .tube-label-top {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #C8A97E;
      margin-bottom: 4px;
    }
    .tube-clock {
      font-size: 12px;
      color: #a89070;
      margin-bottom: 2px;
      font-family: monospace;
      letter-spacing: 0.1em;
    }
    .tube-phase {
      font-size: 13px;
      color: #f0e4cc;
      margin-bottom: 10px;
      min-height: 18px;
    }
    .tube-next {
      font-size: 11px;
      color: #a89070;
      margin-top: 6px;
      min-height: 16px;
      font-style: italic;
    }
    .tube-svg-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #tube-svg {
      width: 100%;
      min-width: 480px;
      max-width: 900px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    /* Track lines */
    .track          { stroke: #3a3028; stroke-width: 4; stroke-linecap: round; }
    .track-girls    { stroke: #7b5ea7; stroke-width: 4; }
    .track-scott    { stroke: #2e7d9f; stroke-width: 4; }
    /* Stop circles */
    .stop           { fill: #2d1f0e; stroke: #5a4a36; stroke-width: 2.5; }
    .stop-girls     { stroke: #b39dcc; }
    .stop-scott     { stroke: #6ab0cc; }
    /* Labels */
    .stop-lbl {
      fill: #a89070;
      font-size: 11px;
      font-family: Georgia, serif;
      text-anchor: middle;
    }
    .stop-lbl-girls { fill: #c4aadf; }
    .stop-lbl-scott { fill: #85c8e8; }
    .fork-tag {
      font-size: 8.5px;
      font-family: Georgia, serif;
      text-anchor: middle;
    }
    .fork-tag-girls { fill: #9a7dbf; }
    .fork-tag-scott { fill: #5aaacf; }
    .date-hint {
      fill: #5a4a36;
      font-size: 8px;
      font-family: monospace;
      text-anchor: middle;
    }
    /* Active stop pulse */
    .pulse-ring {
      fill: none;
      stroke: #C8A97E;
      stroke-width: 2;
      opacity: 0;
      animation: pulseRing 2s ease-out infinite;
    }
    .pulse-dot {
      fill: #C8A97E;
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseRing {
      0%   { r: 10; opacity: 0.8; }
      100% { r: 22; opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }
    /* Completed track segments */
    .track-done { stroke: #5a4a36; }
    /* Active stop highlight */
    .stop-active { stroke: #C8A97E; stroke-width: 3; fill: #2d1f0e; }

    /* ── Confirmation images ── */
    .confirm-wrap {
      margin-top: 16px;
      background: rgba(200,169,126,0.06);
      border: 1px solid rgba(200,169,126,0.25);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .confirm-label {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: #C8A97E;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .confirm-hint {
      font-size: 10px;
      color: #5a4a36;
      margin-top: 6px;
      font-style: italic;
    }
    .confirm-img {
      width: 100%;
      max-width: 300px;
      border-radius: 8px;
      cursor: pointer;
      transition: max-width 0.3s;
      border: 1px solid rgba(200,169,126,0.2);
    }
    .confirm-img.zoomed {
      max-width: 100%;
    }

    /* ── Weather Widgets ── */
    .weather-widget {
      margin-top: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(200,169,126,0.2);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: Georgia, serif;
    }
    .weather-header {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: #C8A97E;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .weather-loading { color: #5a4a36; font-size: 11px; font-style: italic; }
    .weather-error   { color: #7a3a2a; font-size: 11px; font-style: italic; }
    .weather-rows { display: flex; flex-wrap: wrap; gap: 8px; }
    .weather-live { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-top: 8px; }
    .weather-main { text-align: center; min-width: 80px; }
    .weather-icon-big { font-size: 32px; display: block; }
    .weather-temp-big { font-size: 1.6rem; color: #f0e4cc; margin: 2px 0; }
    .weather-feels { font-size: 10px; color: #7a6a56; }
    .weather-details { flex: 1; min-width: 140px; }
    .weather-detail-row { display: flex; justify-content: space-between; font-size: 11px; color: #a89070; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .weather-updated { font-size: 9px; color: #4a3a28; margin-top: 8px; text-align: right; font-style: italic; }
    .weather-day {
      flex: 1;
      min-width: 80px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .weather-day-label { font-size: 9px; color: #a89070; margin-bottom: 4px; letter-spacing: 0.1em; }
    .weather-icon  { font-size: 20px; margin: 4px 0; }
    .weather-temp  { font-size: 11px; color: #f0e4cc; }
    .weather-uv    { font-size: 10px; border-radius: 4px; padding: 2px 6px; margin-top: 4px; display: inline-block; }
    .uv-low      { background: #27ae6033; color: #7ec897; }
    .uv-moderate { background: #f1c40f33; color: #f1c40f; }
    .uv-high     { background: #e67e2233; color: #e67e22; }
    .uv-veryhigh { background: #e74c3c33; color: #e74c3c; }
    .uv-extreme  { background: #8e44ad33; color: #c39bd3; }
  </style>
</head>

    const timeline = document.getElementById('timeline');

    days.forEach((day, i) => {
      const isLast = i === days.length - 1;

      // Spine line gradient
      const spineLineStyle = `background: linear-gradient(to bottom, ${day.color}66, transparent);`;

      // Items HTML
      const itemsHtml = day.items.map(item => `
        <div class="item">
          <div class="item-time" style="color:${day.color}">${item.time}</div>
          <div class="item-text">${item.text}</div>
        </div>
      `).join('');

      // Note HTML
      const noteHtml = day.note ? `
        <div class="note" style="background:${day.color}11; border-color:${day.color}33;">
          📍 ${day.note}
        </div>
      ` : '';
      const confirmHtml = '';

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <div class="spine">
          <div class="icon-circle" style="background:${day.color}22; border:2px solid ${day.color}66; box-shadow:0 0 16px ${day.color}33;">
            ${day.icon}
          </div>
          ${!isLast ? `<div class="spine-line" style="${spineLineStyle}"></div>` : ''}
        </div>
        <div class="card" data-color="${day.color}" data-index="${i}">
          <div class="card-header">
            <div>
              <div class="card-date" style="color:${day.color}">${day.date}</div>
              <div class="card-label">${day.label}</div>
            </div>
            <div class="chevron" style="color:${day.color}">↓</div>
          </div>
          <div class="card-body" style="border-top-color:${day.color}22;">

            ${noteHtml}
            ${confirmHtml}
            ${day.weatherId ? `<div class="weather-widget" id="${day.weatherId}"><div class="weather-loading">Loading forecast...</div></div>` : ''}

      `;
      timeline.appendChild(row);
    });

    // Toggle expand/collapse
    timeline.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      const color = card.dataset.color;
      const body = card.querySelector('.card-body');
      const header = card.querySelector('.card-header');
      const chevron = card.querySelector('.chevron');
      const isOpen = body.classList.contains('open');

      // Close all
      document.querySelectorAll('.card').forEach(c => {
        c.style.borderColor = 'rgba(255,255,255,0.07)';
        c.querySelector('.card-body').classList.remove('open');
        c.querySelector('.card-header').style.background = 'transparent';
        c.querySelector('.chevron').classList.remove('open');
      });

      if (!isOpen) {
        card.style.borderColor = color + '55';
        body.classList.add('open');
        header.style.background = color + '10';
        chevron.classList.add('open');
      }
    });

    // ── Tube Map Live Status ──
    const stops = [
      { id: 'stop-home1',  cx: 50,  cy: 110, label: '🏠 Home — Edinburgh',        start: null,                            end: new Date('2026-07-02T14:10:00') },
      { id: 'stop-fly1',   cx: 130, cy: 110, label: '✈️ Flying to Milan',          start: new Date('2026-07-02T14:10:00'), end: new Date('2026-07-02T17:35:00') },
      { id: 'stop-milan1', cx: 250, cy: 110, label: '🏙️ Milan — Sightseeing',      start: new Date('2026-07-02T17:35:00'), end: new Date('2026-07-04T09:00:00') },
      { id: 'stop-bolo',   cx: 380, cy: 110, label: '🚆 Travelling to Tuscany',    start: new Date('2026-07-04T09:00:00'), end: new Date('2026-07-04T15:00:00') },
      { id: 'stop-tusc',   cx: 480, cy: 110, label: '🍷 Tuscany — Villa Days',     start: new Date('2026-07-04T15:00:00'), end: new Date('2026-07-11T08:00:00') },
      { id: 'stop-turin',  cx: 585, cy: 55,  label: '👧 Girls in Turin with Lara', start: new Date('2026-07-11T08:00:00'), end: new Date('2026-07-13T11:00:00') },
      { id: 'stop-lakes',  cx: 585, cy: 165, label: '⛵ Scott & D at the Lakes',   start: new Date('2026-07-11T08:00:00'), end: new Date('2026-07-13T11:00:00') },
      { id: 'stop-milan2', cx: 690, cy: 110, label: '🥂 Reunion — Milan Linate',   start: new Date('2026-07-13T11:00:00'), end: new Date('2026-07-14T12:00:00') },
      { id: 'stop-fly2',   cx: 780, cy: 110, label: '✈️ Flying Home',              start: new Date('2026-07-14T12:00:00'), end: new Date('2026-07-14T13:40:00') },
      { id: 'stop-home2',  cx: 860, cy: 110, label: '🏠 Back in Edinburgh!',       start: new Date('2026-07-14T13:40:00'), end: null },
    ];

    function getActiveStops(now) {
      if (!stops[1].start || now < stops[1].start) return [stops[0]];
      if (now >= stops[stops.length - 1].start) return [stops[stops.length - 1]];
      const active = stops.filter(s => s.start && s.end && now >= s.start && now < s.end);
      return active.length ? active : [stops[0]];
    }

    function getNextStop(now) {
      if (now < stops[1].start) return stops[1];
      for (let i = 1; i < stops.length; i++) {
        if (stops[i].start && now < stops[i].start) return stops[i];
      }
      return null;
    }

    function formatCountdown(ms) {
      if (ms <= 0) return '';
      const totalMins = Math.floor(ms / 60000);
      const days = Math.floor(totalMins / 1440);
      const hrs  = Math.floor((totalMins % 1440) / 60);
      const mins = totalMins % 60;
      if (days > 0) return `${days}d ${hrs}h ${mins}m`;
      if (hrs > 0)  return `${hrs}h ${mins}m`;
      return `${mins}m`;
    }

    // Add second pulse elements to SVG for fork
    const tubeSvg = document.getElementById('tube-svg');
    const pr2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
    pr2.setAttribute('id','pulse-ring-2'); pr2.setAttribute('cx','585'); pr2.setAttribute('cy','165');
    pr2.setAttribute('r','14'); pr2.setAttribute('class','pulse-ring'); pr2.style.display='none';
    tubeSvg.appendChild(pr2);
    const pd2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
    pd2.setAttribute('id','pulse-dot-2'); pd2.setAttribute('cx','585'); pd2.setAttribute('cy','165');
    pd2.setAttribute('r','9'); pd2.setAttribute('class','pulse-dot'); pd2.style.display='none';
    tubeSvg.appendChild(pd2);

    function updateTubeMap() {
      const now = new Date();

      document.getElementById('tube-clock').textContent =
        now.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      const activeStops = getActiveStops(now);
      const nextStop    = getNextStop(now);

      document.getElementById('tube-phase-label').textContent = activeStops.map(s => s.label).join('  ·  ');

      if (nextStop && nextStop.start) {
        const ms = nextStop.start - now;
        document.getElementById('tube-next').textContent = ms > 0
          ? `⏭  Next: ${nextStop.label}  ·  in ${formatCountdown(ms)}`
          : '';
      } else {
        document.getElementById('tube-next').textContent = nextStop ? `⏭  ${nextStop.label}` : '🏁 Trip complete — welcome home!';
      }

      // Reset all stop styles
      stops.forEach(s => { const el = document.getElementById(s.id); if (el) el.classList.remove('stop-active'); });

      // Move primary pulse
      const p = activeStops[0];
      document.getElementById('pulse-ring').setAttribute('cx', p.cx);
      document.getElementById('pulse-ring').setAttribute('cy', p.cy);
      document.getElementById('pulse-dot').setAttribute('cx', p.cx);
      document.getElementById('pulse-dot').setAttribute('cy', p.cy);

      activeStops.forEach(s => { const el = document.getElementById(s.id); if (el) el.classList.add('stop-active'); });

      // Fork — second pulse dot
      if (activeStops.length > 1) {
        const s2 = activeStops[1];
        document.getElementById('pulse-ring-2').setAttribute('cx', s2.cx);
        document.getElementById('pulse-ring-2').setAttribute('cy', s2.cy);
        document.getElementById('pulse-ring-2').style.display = '';
        document.getElementById('pulse-dot-2').setAttribute('cx', s2.cx);
        document.getElementById('pulse-dot-2').setAttribute('cy', s2.cy);
        document.getElementById('pulse-dot-2').style.display = '';
      } else {
        document.getElementById('pulse-ring-2').style.display = 'none';
        document.getElementById('pulse-dot-2').style.display = 'none';
      }

      // Shade completed tracks
      let activeIdx = 0;
      stops.forEach((s, i) => { if (activeStops.includes(s)) activeIdx = Math.max(activeIdx, i); });

      const trackMap = {
        0: [],
        1: ['tr-home-fly'],
        2: ['tr-home-fly','tr-fly-milan'],
        3: ['tr-home-fly','tr-fly-milan','tr-milan-bolo'],
        4: ['tr-home-fly','tr-fly-milan','tr-milan-bolo','tr-bolo-tusc'],
        5: ['tr-home-fly','tr-fly-milan','tr-milan-bolo','tr-bolo-tusc','tr-fork-turin-a','tr-fork-turin-b','tr-fork-lakes-a','tr-fork-lakes-b'],
        6: ['tr-home-fly','tr-fly-milan','tr-milan-bolo','tr-bolo-tusc','tr-fork-turin-a','tr-fork-turin-b','tr-fork-lakes-a','tr-fork-lakes-b'],
        7: ['tr-home-fly','tr-fly-milan','tr-milan-bolo','tr-bolo-tusc','tr-fork-turin-a','tr-fork-turin-b','tr-fork-turin-c','tr-fork-lakes-a','tr-fork-lakes-b','tr-fork-lakes-c','tr-milan2-fly2'],
        8: ['tr-home-fly','tr-fly-milan','tr-milan-bolo','tr-bolo-tusc','tr-fork-turin-a','tr-fork-turin-b','tr-fork-turin-c','tr-fork-lakes-a','tr-fork-lakes-b','tr-fork-lakes-c','tr-milan2-fly2','tr-fly2-home2'],
        9: ['tr-home-fly','tr-fly-milan','tr-milan-bolo','tr-bolo-tusc','tr-fork-turin-a','tr-fork-turin-b','tr-fork-turin-c','tr-fork-lakes-a','tr-fork-lakes-b','tr-fork-lakes-c','tr-milan2-fly2','tr-fly2-home2'],
      };
      const doneSegs = trackMap[activeIdx] || [];
      ['tr-home-fly','tr-fly-milan','tr-milan-bolo','tr-bolo-tusc','tr-fork-turin-a','tr-fork-turin-b','tr-fork-turin-c','tr-fork-lakes-a','tr-fork-lakes-b','tr-fork-lakes-c','tr-milan2-fly2','tr-fly2-home2'].forEach(tid => {
        const el = document.getElementById(tid);
        if (el) el.classList.toggle('track-done', doneSegs.includes(tid));
      });
    }

    updateTubeMap();
    setInterval(updateTubeMap, 30000);

    // ── Weather Widgets ──
    const WMO = {
      0:'☀️ Clear', 1:'🌤️ Mostly Clear', 2:'⛅ Partly Cloudy', 3:'☁️ Overcast',
      45:'🌫️ Foggy', 48:'🌫️ Icy Fog',
      51:'🌦️ Light Drizzle', 53:'🌦️ Drizzle', 55:'🌧️ Heavy Drizzle',
      61:'🌧️ Light Rain', 63:'🌧️ Rain', 65:'🌧️ Heavy Rain',
      71:'🌨️ Light Snow', 73:'🌨️ Snow', 75:'❄️ Heavy Snow',
      80:'🌦️ Showers', 81:'🌧️ Showers', 82:'⛈️ Heavy Showers',
      95:'⛈️ Thunderstorm', 96:'⛈️ Thunderstorm', 99:'⛈️ Thunderstorm',
    };

    function uvClass(uv) {
      if (uv <= 2)  return ['uv-low',      'UV ' + uv + ' Low'];
      if (uv <= 5)  return ['uv-moderate', 'UV ' + uv + ' Moderate'];
      if (uv <= 7)  return ['uv-high',     'UV ' + uv + ' High ⚠️'];
      if (uv <= 10) return ['uv-veryhigh', 'UV ' + uv + ' Very High ⚠️'];
      return            ['uv-extreme',  'UV ' + uv + ' Extreme 🚨'];
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    async function loadWeather(containerId, lat, lon, locationName) {
      const el = document.getElementById(containerId);
      if (!el) return;
      el.innerHTML = '<div class="weather-loading">Loading live weather...</div>';
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weathercode,uv_index,windspeed_10m,relativehumidity_2m&timezone=Europe%2FRome`;
        const res = await fetch(url);
        const data = await res.json();
        const c = data.current;

        const icon = WMO[c.weathercode] || '🌡️';
        const temp = Math.round(c.temperature_2m);
        const feels = Math.round(c.apparent_temperature);
        const uv   = Math.round(c.uv_index);
        const wind = Math.round(c.windspeed_10m);
        const hum  = c.relativehumidity_2m;
        const [cls, label] = uvClass(uv);

        const updated = new Date(c.time).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

        el.innerHTML = `
          <div class="weather-header">🌤️ Live Weather — ${locationName}</div>
          <div class="weather-live">
            <div class="weather-main">
              <span class="weather-icon-big">${icon.split(' ')[0]}</span>
              <div class="weather-temp-big">${temp}°C</div>
              <div class="weather-feels">Feels like ${feels}°C</div>
            </div>
            <div class="weather-details">
              <div class="weather-detail-row"><span>💨 Wind</span><span>${wind} km/h</span></div>
              <div class="weather-detail-row"><span>💧 Humidity</span><span>${hum}%</span></div>
              <div class="weather-detail-row"><span>🕶️ UV Index</span><span class="weather-uv ${cls}">${label}</span></div>
            </div>
          </div>
          <div class="weather-updated">Updated ${updated} local time</div>`;
      } catch(e) {
        el.innerHTML = '<div class="weather-error">⚠️ Could not load weather — check connection</div>';
      }
    }

    // Load live weather for all locations
    loadWeather('weather-milan1',  45.4654, 9.1859,  'Milan');
    loadWeather('weather-milan2',  45.4654, 9.1859,  'Milan');

    loadWeather('weather-turin',   45.0703, 7.6869,  'Turin');
    loadWeather('weather-lakes',   45.7833, 9.3500,  'Oggiono, Lakes');
